name: JidanIOS

options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    CLANG_ENABLE_MODULES: YES

targets:
  JidanIOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jidan.iosshell
        PRODUCT_NAME: JidanIOS
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 鸡蛋
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 鸡蛋只会在你点下麦克风后听取语音，把它转成文字。
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: 鸡蛋需要使用苹果语音识别，把你说的话转成可见文字。
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO

  JidanIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: JidanIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jidan.iosshell.tests
        GENERATE_INFOPLIST_FILE: YES

  JidanIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: JidanIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jidan.iosshell.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  JidanIOS:
    build:
      targets:
        JidanIOS: all
    test:
      gatherCoverageData: true
      targets:
        - JidanIOSTests
        - JidanIOSUITests

name: Bug report
description: Report a reproducible Jidan defect
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not post credentials, private device data, or security vulnerabilities here.
  - type: input
    id: version
    attributes:
      label: Commit or version
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - JGraph runtime
        - Android AppFunctions adapter
        - Reference app
        - Language or translation
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: State whether it performs a real external action.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
